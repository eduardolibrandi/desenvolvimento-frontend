<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício: Pseudo-classes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        ul {
            list-style: none; /* Remove as bolinhas padrão da lista */
            padding: 0;
            max-width: 400px;
            margin: 0 auto;
        }

        li {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s; /* Deixa a transição do efeito hover mais suave */
        }

        /* --- REGRAS DO EXERCÍCIO COM PSEUDO-CLASSES --- */

        /* 1. Aplica cor de fundo alternada (itens ímpares: 1, 3 e 5) */
        li:nth-child(odd) {
            background-color: #e0e0e0;
        }

        /* 2. Destaque do primeiro item com cor de texto diferente */
        li:first-child {
            color: #d32f2f; /* Vermelho */
            font-weight: bold;
        }

        /* 3. Borda aplicada apenas ao último item da lista */
        li:last-child {
            border: 2px solid #1976d2; /* Borda azul */
        }

        /* 4. Altera a cor de fundo quando o mouse passa por cima (:hover) */
        /* Nota: Colocamos o :hover por último para sobrepor a cor do :nth-child */
        li:hover {
            background-color: #bbdefb; /* Azul claro ao passar o mouse */
        }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Exercício: Pseudo-classes em Listas</h1>

    <ul>
        <li>Item 1 (Primeiro item + Ímpar)</li>
        <li>Item 2 (Par)</li>
        <li>Item 3 (Ímpar)</li>
        <li>Item 4 (Par)</li>
        <li>Item 5 (Último item + Ímpar)</li>
    </ul>

</body>
</html>
