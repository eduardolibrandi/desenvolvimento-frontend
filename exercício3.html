<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título da Sua Página</title>
    <style>
        /* Ajusta o corpo para ocupar a tela sem barras de rolagem */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            text-align: center;
            background-color: lightgray;
            font-family: sans-serif;
        }

        h1 {
            margin-bottom: 5px;
            margin-top: 10px;
        }

        p {
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* --- ESTILOS DAS CAIXAS --- */
        .caixa {
            width: 80%;
            height: 15vh;
            border: 2px solid black;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .caixa-1 {
            margin: 0 auto 10px auto;
            background-color: white;
        }

        .caixa-2 {
            margin: 0 auto 10px auto;
            background-color: inherit; /* Herda a cor cinza do body */
        }

        .caixa-3 {
            margin: 0 auto 10px auto;
            background-color: initial; /* Reseta para o padrão transparente */
        }

        /* --- NOVAS REGRAS DE CSS SOLICITADAS --- */

        /* 1. Altera a cor de fundo do campo required para amarelo */
        input:required {
            background-color: yellow;
        }

        /* 2. Deixa o botão disabled mais opaco (semi-transparente) */
        button:disabled {
            opacity: 0.4; /* 40% de opacidade */
            cursor: not-allowed;
        }

        /* 3. Borda azul para qualquer elemento com atributo data-type="primary" */
        [data-type="primary"] {
            border: 3px solid blue;
        }
    </style>
</head>
<body>

    <h1>Exercício 03</h1>
    <p>Arquivo criado, com ajuda de Inteligência Artificial, como prática do curso de desenvolvimento front-end.</p>

    <!-- Caixa 1 -->
    <div class="caixa caixa-1">
        Caixa 1
    </div>

    <!-- Caixa 2 (com atributo data-type="primary" que aplica a borda azul) -->
    <div class="caixa caixa-2" data-type="primary">
        Caixa 2 (inherit + borda azul data-type="primary")
    </div>

    <!-- Caixa 3 com o formulário de exemplo dentro -->
    <div class="caixa caixa-3">
        <form>
            <!-- Campo Required (fica amarelo) -->
            <input type="text" placeholder="Campo obrigatório" required>
            
            <!-- Botão Disabled (fica mais opaco) -->
            <button type="button" disabled>Botão Desativado</button>
        </form>
    </div>

</body>
</html>
